<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Horarios · MediConsult</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#d4a017', 'primary-light': '#f4c430', 'background-dark': '#0f172a', 'background-card': '#1e293b' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="horarios" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main>
    <section class="py-20 border-b border-primary/10">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <p class="text-primary uppercase tracking-[0.3em] text-xs mb-3 font-medium">Disponibilidad semanal</p>
        <h1 class="text-5xl md:text-6xl font-bold text-white mb-6" style="font-family: 'Playfair Display', serif;">Horarios de atención</h1>
        <p class="text-gray-300 text-lg max-w-2xl mx-auto">Consulta los turnos disponibles por día y reserva directamente con el especialista.</p>
      </div>
    </section>

    <section class="py-12">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-wrap justify-center gap-2 mb-10" id="dayTabs"></div>

        <div class="bg-background-card border border-gray-800 rounded-2xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-background-dark/50 border-b border-primary/20">
                <tr>
                  <th class="text-left text-xs font-semibold text-primary uppercase tracking-wider px-6 py-4">Consulta</th>
                  <th class="text-left text-xs font-semibold text-primary uppercase tracking-wider px-6 py-4">Especialista</th>
                  <th class="text-left text-xs font-semibold text-primary uppercase tracking-wider px-6 py-4">Hora</th>
                  <th class="text-left text-xs font-semibold text-primary uppercase tracking-wider px-6 py-4">Cupo</th>
                  <th class="text-right text-xs font-semibold text-primary uppercase tracking-wider px-6 py-4">Acción</th>
                </tr>
              </thead>
              <tbody id="scheduleBody" class="divide-y divide-gray-800"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section class="py-16 bg-background-card/40 border-t border-primary/10">
      <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl mx-auto">
          <h2 class="text-3xl font-bold text-white mb-8 text-center" style="font-family: 'Playfair Display', serif;">Horario del consultorio</h2>
          <div class="bg-background-card border border-gray-800 rounded-2xl p-6" id="horarioLocal"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="appFooter"></div>
  <script src="js/app.js"></script>
  <script>
    const DIAS = [
      { key: 'lunes', label: 'Lunes' },
      { key: 'martes', label: 'Martes' },
      { key: 'miercoles', label: 'Miércoles' },
      { key: 'jueves', label: 'Jueves' },
      { key: 'viernes', label: 'Viernes' },
      { key: 'sabado', label: 'Sábado' },
      { key: 'domingo', label: 'Domingo' }
    ];

    function pageInit() {
      const tabs = document.getElementById('dayTabs');
      const body = document.getElementById('scheduleBody');
      const localBox = document.getElementById('horarioLocal');

      localBox.innerHTML = DIAS.map(d => {
        const h = HORARIOS[d.key];
        return `
          <div class="flex items-center justify-between py-3 border-b border-gray-800 last:border-0">
            <span class="text-gray-300 font-medium">${d.label}</span>
            <span class="text-${h.abierto ? 'primary' : 'gray-500'} font-bold">${h.abierto ? h.desde + ' - ' + h.hasta : 'Cerrado'}</span>
          </div>
        `;
      }).join('');

      function renderDay(dayKey) {
        const h = HORARIOS[dayKey];
        if (!h.abierto) {
          body.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-gray-500">El consultorio no abre este día. Te esperamos pronto.</td></tr>`;
          return;
        }

        const rows = [];
        let cur = h.desde;
        let cupos = [12, 15, 8, 10, 14, 18, 20];

        SERVICIOS.forEach((s, idx) => {
          const prof = PROFESIONALES.find(p => p.especialidades.includes(s.id));
          const cup = cupos[(idx + dayKey.length) % cupos.length];
          rows.push(`
            <tr class="hover:bg-primary/5 transition-colors">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <img src="${s.imagen}" class="h-10 w-10 rounded object-cover" alt=""/>
                  <span class="text-white font-medium">${s.nombre}</span>
                </div>
              </td>
              <td class="px-6 py-4 text-gray-300">${prof ? prof.nombre : 'Cualquiera'}</td>
              <td class="px-6 py-4 text-primary font-semibold">${cur}</td>
              <td class="px-6 py-4 text-gray-400">${cup}/20</td>
              <td class="px-6 py-4 text-right">
                <a href="reserva.html?servicio=${s.id}" class="btn-primary text-xs px-4 py-2">Reservar</a>
              </td>
            </tr>
          `);
          const [hh, mm] = cur.split(':').map(Number);
          let total = hh * 60 + mm + s.duracion;
          const hH = Math.floor(total / 60);
          const hM = total % 60;
          cur = `${String(hH).padStart(2,'0')}:${String(hM).padStart(2,'0')}`;
          if (cur > h.hasta) cur = h.desde;
        });

        body.innerHTML = rows.join('');
      }

      tabs.innerHTML = DIAS.map((d, i) => `
        <button data-day="${d.key}" class="day-tab px-5 py-2 rounded-full text-sm font-semibold transition-all ${i === 0 ? 'bg-primary text-background-dark' : 'bg-background-card text-gray-300 border border-gray-800 hover:border-primary'}">${d.label}</button>
      `).join('');

      tabs.querySelectorAll('.day-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.querySelectorAll('.day-tab').forEach(t => { t.classList.remove('bg-primary', 'text-background-dark'); t.classList.add('bg-background-card', 'text-gray-300', 'border', 'border-gray-800'); });
          tab.classList.add('bg-primary', 'text-background-dark');
          tab.classList.remove('bg-background-card', 'text-gray-300', 'border', 'border-gray-800');
          renderDay(tab.dataset.day);
        });
      });

      renderDay('lunes');
    }
  </script>
</body>
</html>
