<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil · MediConsult</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { primary: '#d4a017', 'primary-light': '#f4c430', 'background-dark': '#0f172a', 'background-card': '#1e293b' },
          fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="perfil" class="bg-background-dark text-gray-200 font-sans">
  <div id="appHeader"></div>

  <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
      <aside class="lg:col-span-1">
        <div class="bg-background-card border border-gray-800 rounded-2xl p-6 lg:sticky lg:top-28">
          <div class="text-center mb-6">
            <div class="relative inline-block">
              <img id="avatarImg" src="" class="h-24 w-24 rounded-full object-cover border-2 border-primary/40"/>
              <button id="btnChangePhoto" class="absolute bottom-0 right-0 h-8 w-8 rounded-full bg-primary text-background-dark flex items-center justify-center hover:bg-primary-light transition-colors">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 2h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              </button>
            </div>
            <h3 id="userName" class="text-white font-bold mt-3 text-lg" style="font-family: 'Playfair Display', serif;"></h3>
            <p id="userEmail" class="text-gray-400 text-sm"></p>
            <span class="inline-block mt-2 text-xs bg-primary/10 text-primary border border-primary/30 px-3 py-1 rounded-full">Paciente Premium</span>
          </div>

          <nav class="space-y-1">
            <button data-tab="historial" class="tab-btn w-full text-left flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-primary bg-primary/10 transition-colors">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              Mis reservas
            </button>
            <button data-tab="datos" class="tab-btn w-full text-left flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300 hover:bg-primary/5 transition-colors">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
              Mis datos
            </button>
            <button data-tab="seguridad" class="tab-btn w-full text-left flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300 hover:bg-primary/5 transition-colors">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
              Seguridad
            </button>
            <a href="reserva.html" class="w-full text-left flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-gray-300 hover:bg-primary/5 transition-colors">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
              Nueva reserva
            </a>
            <button id="btnLogoutSide" class="w-full text-left flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium text-red-400 hover:bg-red-500/10 transition-colors mt-3 border-t border-gray-800 pt-3">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
              Cerrar sesión
            </button>
          </nav>
        </div>
      </aside>

      <section class="lg:col-span-3 space-y-6">
        <div id="tab-historial">
          <div class="flex items-center justify-between flex-wrap gap-3 mb-5">
            <div>
              <h2 class="text-3xl font-bold text-white" style="font-family: 'Playfair Display', serif;">Mis reservas</h2>
              <p class="text-gray-400 text-sm mt-1">Historial completo de tus citas médicas</p>
            </div>
            <a href="reserva.html" class="btn-primary text-sm">+ Nueva reserva</a>
          </div>
          <div class="flex flex-wrap gap-2 mb-5" id="filterEstado">
            <button data-filter="todas" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border border-primary bg-primary text-background-dark">Todas</button>
            <button data-filter="pendiente" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border border-gray-700 text-gray-300 hover:border-primary">Pendientes</button>
            <button data-filter="confirmada" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border border-gray-700 text-gray-300 hover:border-primary">Confirmadas</button>
            <button data-filter="completada" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border border-gray-700 text-gray-300 hover:border-primary">Completadas</button>
            <button data-filter="anulada" class="filter-btn px-4 py-1.5 rounded-full text-xs font-semibold border border-gray-700 text-gray-300 hover:border-primary">Anuladas</button>
          </div>
          <div id="reservasList" class="space-y-3"></div>
        </div>

        <div id="tab-datos" class="hidden">
          <h2 class="text-3xl font-bold text-white mb-1" style="font-family: 'Playfair Display', serif;">Mis datos</h2>
          <p class="text-gray-400 text-sm mb-6">Actualiza tu información personal</p>
          <form id="formDatos" class="bg-background-card border border-gray-800 rounded-2xl p-6 space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Nombre completo</label>
                <input type="text" id="datosNombre" required class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors"/>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Teléfono</label>
                <input type="tel" id="datosTelefono" required class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors"/>
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
              <input type="email" id="datosEmail" required class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors"/>
            </div>
            <div class="flex justify-end gap-3 pt-2">
              <button type="button" id="btnCancelDatos" class="btn-outline text-sm">Cancelar</button>
              <button type="submit" class="btn-primary text-sm">Guardar cambios</button>
            </div>
          </form>
        </div>

        <div id="tab-seguridad" class="hidden">
          <h2 class="text-3xl font-bold text-white mb-1" style="font-family: 'Playfair Display', serif;">Seguridad</h2>
          <p class="text-gray-400 text-sm mb-6">Gestiona tu contraseña y seguridad</p>
          <form id="formPass" class="bg-background-card border border-gray-800 rounded-2xl p-6 space-y-4 max-w-lg">
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-2">Contraseña actual</label>
              <input type="password" id="passActual" required class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors"/>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-2">Nueva contraseña</label>
              <input type="password" id="passNueva" required minlength="6" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors"/>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-300 mb-2">Confirmar nueva contraseña</label>
              <input type="password" id="passNueva2" required minlength="6" class="w-full bg-background-dark border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors"/>
            </div>
            <div class="flex justify-end pt-2">
              <button type="submit" class="btn-primary text-sm">Actualizar</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <div id="appFooter"></div>
  <script src="js/app.js"></script>
  <script>
    function pageInit() {
      if (!UI.requireAuth('perfil.html')) return;
      const user = Auth.current();
      document.getElementById('userName').textContent = user.nombre;
      document.getElementById('userEmail').textContent = user.email;
      document.getElementById('avatarImg').src = user.foto;

      let currentFilter = 'todas';

      function renderReservas() {
        const all = Reservas.listByUser(user.id);
        const filtered = currentFilter === 'todas' ? all : all.filter(r => r.estado === currentFilter);
        filtered.sort((a, b) => b.createdAt - a.createdAt);
        const list = document.getElementById('reservasList');

        if (!filtered.length) {
          list.innerHTML = `
            <div class="bg-background-card border border-gray-800 rounded-2xl p-12 text-center">
              <svg class="h-12 w-12 text-gray-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
              <p class="text-gray-400 mb-4">${currentFilter === 'todas' ? 'Aún no tienes reservas' : 'No tienes reservas con este estado'}</p>
              <a href="reserva.html" class="btn-primary text-sm">Reservar mi primera cita</a>
            </div>
          `;
          return;
        }

        list.innerHTML = filtered.map(r => {
          const s = UI.servicioById(r.servicioId);
          const p = UI.profesionalById(r.profesionalId);
          const eb = UI.estadoBadge(r.estado);
          const pb = UI.pagoBadge(r.pago);
          return `
            <a href="detalle-reserva.html?id=${r.id}" class="block bg-background-card border border-gray-800 rounded-xl p-4 hover:border-primary/40 transition-all">
              <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                <img src="${s.imagen}" class="h-16 w-16 rounded-lg object-cover flex-shrink-0"/>
                <div class="flex-1 min-w-0">
                  <div class="flex flex-wrap items-center gap-2 mb-1">
                    <h4 class="text-white font-semibold">${s.nombre}</h4>
                    <span class="text-xs uppercase px-2 py-0.5 rounded-full border ${eb.cls}">${eb.label}</span>
                    <span class="text-xs uppercase px-2 py-0.5 rounded-full border ${pb.cls}">${pb.label}</span>
                  </div>
                  <p class="text-sm text-gray-400">con <span class="text-primary">${p.nombre}</span></p>
                  <p class="text-sm text-gray-300 mt-1"><svg class="inline h-4 w-4 text-primary mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>${UI.formatDate(r.fecha)} · ${r.hora}</p>
                </div>
                <div class="text-right flex-shrink-0">
                  <p class="text-primary font-bold text-lg" style="font-family: 'Playfair Display', serif;">${UI.formatPrice(UI.reservaPrecio(r))}</p>
                  <p class="text-xs text-gray-500 mt-1">Ver detalle →</p>
                </div>
              </div>
            </a>
          `;
        }).join('');
      }

      renderReservas();

      document.querySelectorAll('#filterEstado .filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentFilter = btn.dataset.filter;
          document.querySelectorAll('#filterEstado .filter-btn').forEach(b => { b.classList.remove('bg-primary', 'text-background-dark', 'border-primary'); b.classList.add('border-gray-700', 'text-gray-300'); });
          btn.classList.add('bg-primary', 'text-background-dark', 'border-primary');
          btn.classList.remove('border-gray-700', 'text-gray-300');
          renderReservas();
        });
      });

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.dataset.tab;
          document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('text-primary', 'bg-primary/10'); b.classList.add('text-gray-300'); });
          btn.classList.add('text-primary', 'bg-primary/10');
          btn.classList.remove('text-gray-300');
          ['historial','datos','seguridad'].forEach(t => document.getElementById('tab-'+t).classList.add('hidden'));
          document.getElementById('tab-'+tab).classList.remove('hidden');
        });
      });

      function fillDatos() {
        const u = Auth.current();
        document.getElementById('datosNombre').value = u.nombre;
        document.getElementById('datosTelefono').value = u.telefono;
        document.getElementById('datosEmail').value = u.email;
      }
      fillDatos();

      document.getElementById('btnCancelDatos').addEventListener('click', fillDatos);

      document.getElementById('formDatos').addEventListener('submit', (e) => {
        e.preventDefault();
        const data = {
          nombre: document.getElementById('datosNombre').value.trim(),
          telefono: document.getElementById('datosTelefono').value.trim(),
          email: document.getElementById('datosEmail').value.trim()
        };
        const res = Auth.update(user.id, data);
        if (!res.ok) { UI.toast('Error al actualizar', 'error'); return; }
        UI.toast('Datos actualizados correctamente');
        setTimeout(() => window.location.reload(), 700);
      });

      document.getElementById('formPass').addEventListener('submit', (e) => {
        e.preventDefault();
        const u = Auth.current();
        const act = document.getElementById('passActual').value;
        const n1 = document.getElementById('passNueva').value;
        const n2 = document.getElementById('passNueva2').value;
        if (act !== u.password) { UI.toast('La contraseña actual es incorrecta', 'error'); return; }
        if (n1 !== n2) { UI.toast('Las contraseñas nuevas no coinciden', 'error'); return; }
        Auth.update(user.id, { password: n1 });
        UI.toast('Contraseña actualizada');
        e.target.reset();
      });

      document.getElementById('btnChangePhoto').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            Auth.update(user.id, { foto: reader.result });
            UI.toast('Foto actualizada');
            setTimeout(() => window.location.reload(), 500);
          };
          reader.readAsDataURL(file);
        };
        input.click();
      });

      document.getElementById('btnLogoutSide').addEventListener('click', (e) => {
        e.preventDefault();
        Auth.logout();
        UI.toast('Sesión cerrada');
        setTimeout(() => window.location.href = 'index.html', 600);
      });
    }
  </script>
</body>
</html>
